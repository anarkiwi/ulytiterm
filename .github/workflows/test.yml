name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: build
        run: |
          ./build.sh

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: harness
        run: |
          pip install -r tests/integration/requirements.txt
      - name: build
        run: |
          make
      - name: drive VICE
        run: |
          make integration
